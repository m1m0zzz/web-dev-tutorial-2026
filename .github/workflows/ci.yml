name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN の権限を最小にする（リポジトリの既定値に依存させない）
permissions:
  contents: read

jobs:
  check:
    name: Lint / 型 / 単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 1.4 で入れた safe-chain を CI でも効かせる（--ci でシムを PATH に置く）
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.15/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck -w apps/web
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/web
      - run: npm test -w apps/api

  e2e:
    name: E2E テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci.yml の check ジョブと同じく safe-chain を通す（ジョブをまたいでは引き継がれない）
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.15/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      - run: npm ci

      # ブラウザ本体と、動作に必要なシステムライブラリを入れる
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # main への push のときだけ、どちら側が変わったかを調べる

  chapter-01:
    name: 章ブランチ (chapter-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chapter-01

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # この時点では依存も apps/ 配下のパッケージも無いので、
      # ルートの package.json が読めることだけを確認する
      - run: npm pkg get workspaces

  chapters:
    name: 章ブランチ (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - chapter-02
          - chapter-03
          - chapter-04
          - chapter-05
          - chapter-06
          - chapter-07
          - chapter-08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 章によって存在するスクリプトが違うため --if-present で回す
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npm run build -w apps/web
